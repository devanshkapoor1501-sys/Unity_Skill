[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyforge"
version = "0.0.1"
description = "Local, contract-driven Blender-to-Unity capability engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1.2,<2", "types-jsonschema>=4.23", "setuptools>=77", "wheel"]

[project.scripts]
polyforge = "polyforge.cli:main"

[tool.setuptools.packages.find]
include = ["polyforge*", "unity_package*"]

[tool.setuptools.package-data]
polyforge = ["py.typed", "contracts/*.json", "data/*.json", "data/*.md"]
unity_package = ["package.json", "*.md", "**/*.cs", "**/*.asmdef", "**/*.meta", "*.meta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not blender and not unity'"
markers = ["blender: real Blender application integration gate; run separately with -m blender", "unity: real Unity Editor gate; run separately with -m unity"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["polyforge", "tools"]

[tool.coverage.run]
source = ["polyforge.contracts", "polyforge.security", "polyforge.blender.recipes", "polyforge.blender.interchange", "polyforge.unity.bootstrap", "polyforge.unity.evidence", "polyforge.unity.transactions", "polyforge.scenarios.arena_oracle", "polyforge.unity.upgrade"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
