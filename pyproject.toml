[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyforge"
version = "0.0.1"
description = "Local, contract-driven Blender-to-Unity capability engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5", "tree-sitter==0.26.0", "tree-sitter-c-sharp==0.23.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "build>=1.2,<2", "types-jsonschema>=4.23", "setuptools>=77", "wheel"]

[project.scripts]
polyforge = "polyforge.cli:main"

[tool.setuptools.packages.find]
include = ["polyforge*", "unity_package*"]

[tool.setuptools.package-data]
polyforge = ["py.typed", "contracts/*.json", "data/*.json", "data/*.md", "data/*.txt", "data/benchmark-core/*.json", "data/benchmark-core/briefs/*.md"]
unity_package = ["package.json", "*.md", "**/*.cs", "**/*.asmdef", "**/*.meta", "*.meta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not blender and not unity'"
markers = ["blender: real Blender application integration gate; run separately with -m blender", "unity: real Unity Editor gate; run separately with -m unity"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["polyforge", "tools"]

[tool.coverage.run]
source = ["polyforge.cleanup", "polyforge.capabilities.dispatch", "polyforge.workforce.workers", "polyforge.workforce.operations", "tools.reproducible_build", "polyforge.unity.platformer", "polyforge.inspection", "polyforge.benchmark", "polyforge.runner.metrics", "polyforge.unity.performance", "polyforge.scenarios.platformer_oracle", "polyforge.contracts", "polyforge.security", "polyforge.blender.recipes", "polyforge.blender.modeling", "polyforge.blender.modeling_inspection", "polyforge.blender.interchange", "polyforge.unity.bootstrap", "polyforge.unity.evidence", "polyforge.unity.transactions", "polyforge.scenarios.arena_oracle", "polyforge.unity.upgrade", "polyforge.workforce.discovery", "polyforge.workforce.models", "polyforge.workforce.permissions", "polyforge.workforce.router", "polyforge.workforce.ledger", "polyforge.animation.contract", "polyforge.assets.contracts", "polyforge.sprites.contracts", "polyforge.sprites.images", "polyforge.runner.locks", "polyforge.runner.artifacts", "polyforge.runner.workspace_lock", "polyforge.host.stdio", "polyforge.knowledge.catalog", "polyforge.knowledge.router", "polyforge.knowledge.probes", "polyforge.knowledge.availability", "polyforge.review.amendments", "polyforge.review.sprite_source", "polyforge.review.board", "polyforge.review.acceptance", "polyforge.repairs.diagnostics"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
