name: Offline engine quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check polyforge tools tests
      - run: python -m mypy
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=json
      - run: python -m tools.check_coverage
      - run: python -m tools.generate_cli_docs --check
      - run: python -m tools.reproducible_build --outdir dist/release-a --epoch 1793318400
      - run: python -m tools.reproducible_build --outdir dist/release-b --epoch 1793318400
      - name: Compare independent release builds
        run: python -c "from pathlib import Path; a=Path('dist/release-a'); b=Path('dist/release-b'); assert {p.name:p.read_bytes() for p in a.iterdir()} == {p.name:p.read_bytes() for p in b.iterdir()}, 'Release builds differ'"
      - run: polyforge capability list --json
