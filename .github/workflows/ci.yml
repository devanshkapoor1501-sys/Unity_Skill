name: Offline engine quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov --cov-report=term-missing
      - run: python -m tools.generate_cli_docs --check
      - run: python -m build --no-isolation
      - run: polyforge capability list --json
